# Fly.io config for the Kinetic API. Change `app` to the name you created with `fly launch`
# or `fly apps create`, and use the same name in web/vercel.json.
app = "kinetic-api"
primary_region = "fra"

[build]

[env]
  KINETIC_API_HOST = "0.0.0.0"
  KINETIC_API_PORT = "8080"
  # FIT files and Garmin tokens live on the persistent volume mounted at /data
  KINETIC_UPLOAD_DIR = "/data/uploads"
  KINETIC_GARMIN_TOKEN_DIR = "/data/garmin_tokens"

[[mounts]]
  source = "kinetic_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend (not stop) when idle: memory is kept, so a pending Garmin MFA login survives
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
