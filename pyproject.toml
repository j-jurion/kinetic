[project]
name = "kinetic"
version = "0.1.0"
description = "Activity tracking web app"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0.0",
    "fastapi>=0.111.0",
    "sqlmodel>=0.0.19",
    "fitparse>=1.2.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "folium>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
