[project]
name = "kinetic"
version = "0.1.0"
description = "Activity tracking app: FastAPI backend with a React web frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "sqlmodel>=0.0.19",
    "fitparse>=1.2.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "garminconnect>=0.3.7",
    "curl_cffi>=0.7.0",
    "loguru>=0.7.3",
    "pwdlib[argon2]>=0.2",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
