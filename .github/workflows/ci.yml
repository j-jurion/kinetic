name: CI

# Runs on pull requests and on pushes to other branches. Pushes to main run it through
# fly-deploy.yml instead, so a failing check stops the deploy.
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests run.py
      - run: uv run pytest -q -p no:warnings

  web:
    name: Web (eslint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  shared:
    name: Shared code (vitest + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
